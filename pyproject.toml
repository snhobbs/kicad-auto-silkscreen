[project]
name = "kicad_auto_silkscreen"
version = "1.1.1"
dynamic = ["dependencies"]
authors = [{ name = "Simon Hobbs", email = 'simon.hobbs@electrooptical.net' }]
requires-python = '>=3.6'
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.6',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
]
description = "Place components in a kicad file programmatically."
keywords = [
    'kicad_auto_silkscreen',
    'kicad',
    'python',
    'eda',
    'electronics',
    'pcb',
    'manufacturing',
]
readme = "README.md"

[project.scripts]
kicad_auto_silkscreen = 'kicad_auto_silkscreen.cli:main'

[project.urls]
github = 'https://github.com/snhobbs/kicad_auto_silkscreen.git'

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.hatch.metadata]
allow-direct-references = true

[tool.setuptools.packages.find]
where = ['src']

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
python_files = ["tests.py", "test_*.py"]
